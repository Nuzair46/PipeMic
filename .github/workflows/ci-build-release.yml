name: Release Build and Publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 0.2.0) or bump kind (patch/minor/major)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipemic-release
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare Release Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      commit_sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release runs from main
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release pipeline must be run from the main branch." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version across all manifests
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node tools/version-bump.mjs "$RELEASE_VERSION"

      - name: Resolve bumped version metadata
        id: resolve
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = String(pkg.version || "");
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version)) {
            throw new Error(`Unexpected version format after bump: ${version}`);
          }
          const tagName = `v${version}`;
          const prerelease = version.includes("-") ? "true" : "false";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=${tagName}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${prerelease}\n`);
          console.log(`Resolved release version: ${version}`);
          console.log(`Resolved release tag: ${tagName}`);
          NODE

      - name: Fail if version change produced no diff
        shell: bash
        run: |
          if git diff --quiet -- package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json; then
            echo "No version changes detected. Provide a new version." >&2
            exit 1
          fi

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ steps.resolve.outputs.tag_name }}" >/dev/null; then
            echo "Tag already exists: ${{ steps.resolve.outputs.tag_name }}" >&2
            exit 1
          fi

      - name: Upload prepared manifests
        uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            package.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json


  release_build:
    name: Build Windows Release
    needs: prepare_release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}

      - name: Restore prepared manifests
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-msvc
          cache-on-failure: true

      - name: Cache Tauri packaging tools
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-tools-v1-${{ hashFiles('yarn.lock') }}

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --prefer-offline --non-interactive

      - name: Check manifest versions
        run: yarn version:bump --check

      - name: Run frontend tests
        run: yarn test

      - name: Build frontend
        run: yarn build

      - name: Run Rust tests
        # Match the bundle's profile/features so dependencies compile once.
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol --locked

      - name: Build Windows app (NSIS)
        # Invoke the installed CLI directly so Yarn 1 cannot consume Cargo's separator.
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config src-tauri/tauri.ci.conf.json -- --locked

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipemic-windows-nsis-${{ needs.prepare_release.outputs.version }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*setup.exe

  publish_release:
    name: Publish GitHub Release
    needs:
      - prepare_release
      - release_build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Restore validated manifests
        uses: actions/download-artifact@v4
        with:
          name: release-manifests
          path: .

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: pipemic-windows-nsis-${{ needs.prepare_release.outputs.version }}
          path: dist

      - name: Commit and tag validated release
        id: commit
        env:
          VALIDATED_SHA: ${{ needs.prepare_release.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag_name }}
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]; then
            echo "main changed while this release was building. Run the release again." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG"; then
            echo "The release tag already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): $RELEASE_TAG [skip ci]"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          name: PipeMic ${{ needs.prepare_release.outputs.tag_name }}
          target_commitish: ${{ steps.commit.outputs.commit_sha }}
          files: dist/**/*setup.exe
          generate_release_notes: true
          prerelease: ${{ needs.prepare_release.outputs.prerelease == 'true' }}
